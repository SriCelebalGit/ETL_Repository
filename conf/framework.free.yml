# =====================================================================================
# Framework configuration - DATABRICKS FREE EDITION
# -------------------------------------------------------------------------------------
# This file is the single source of truth for names and locations. Change a catalog here
# and re-run notebooks/00_setup_framework.py - it creates whatever this file names.
#
# Differences from the ADLS-based configuration, and why:
#
#   * checkpoint_root is a UC Volume path. Free Edition has no storage credential, so
#     abfss:// is unavailable. Auto Loader's schema store and streaming checkpoints go
#     into a managed Volume instead. A path containing "://" is rejected at config load.
#
#   * use_notifications is false and cannot be changed. File notification mode needs
#     cloud queue resources Free Edition does not provide, so Auto Loader uses directory
#     listing - fine at any volume you can generate here.
#
#   * No schedule and low concurrency, to stay inside the serverless budget.
#
# THE ONE THING TO GET RIGHT: catalog naming. See the two layouts below.
# =====================================================================================

environment: free

# =====================================================================================
# LAYOUT A - single catalog, schema per layer  (the default, safest on Free Edition)
# -------------------------------------------------------------------------------------
# All three layer tokens resolve to one catalog. The layers are separated by SCHEMA,
# which the metadata YAML sets as bronze_crm / silver_crm / gold_sales.
#
# This matters: with one catalog, if bronze and silver both used schema "crm" then
# bronze.crm.customer and silver.crm.customer would be the SAME table and the silver
# load would overwrite its own source. Notebook 00 fails the setup if it detects that.
#
# `etl_lakehouse` is created for you. To reuse a catalog you already have (Free Edition
# usually ships `workspace`), put its name in all four places below.
# =====================================================================================

framework_catalog: etl_lakehouse
control_schema: etl_control
audit_schema: etl_audit

catalogs:
  bronze: etl_lakehouse
  silver: etl_lakehouse
  gold: etl_lakehouse

checkpoint_root: /Volumes/etl_lakehouse/etl_volumes/checkpoints

# =====================================================================================
# LAYOUT B - catalog per layer  (closer to a production deployment)
# -------------------------------------------------------------------------------------
# Uncomment this block and comment out Layout A above. Notebook 00 creates all four
# catalogs. Everything else - the metadata YAML included - works unchanged, because
# control rows carry the logical tokens `bronze` / `silver` / `gold`, not catalog names.
#
# framework_catalog: etl_framework
# control_schema: control
# audit_schema: audit
#
# catalogs:
#   bronze: etl_bronze
#   silver: etl_silver
#   gold:   etl_gold
#
# checkpoint_root: /Volumes/etl_framework/etl_volumes/checkpoints
#
# With Layout B the layer schemas no longer need their prefixes - bronze_crm could be
# just crm - but leaving them as they are costs nothing and keeps one set of metadata
# working under both layouts.
# =====================================================================================

# ---- what notebook 00 provisions ---------------------------------------------------
# Read only by notebooks/00_setup_framework.py. The framework's runtime path ignores it.
free_edition:
  # Attempt CREATE CATALOG for anything named above that does not exist yet. If your
  # workspace refuses it, notebook 00 says so and tells you how to fall back to a
  # catalog you already have.
  create_catalogs: true

  # Where the two Volumes live. Defaults to framework_catalog when volumes_catalog is
  # omitted; checkpoint_root must point inside the checkpoint volume, and notebook 00
  # verifies that.
  volumes_catalog: etl_lakehouse
  volumes_schema: etl_volumes
  landing_volume: landing
  checkpoint_volume: checkpoints

  # Schemas to create per layer. Each is created in THAT layer's catalog, so this works
  # under both layouts above. Keys are the logical layer tokens.
  layer_schemas:
    bronze:
      - bronze_crm
    silver:
      - silver_crm
    gold:
      - gold_sales

# ---- defaults applied when a control column is NULL --------------------------------
defaults:
  schema_evolution_mode: addNewColumns
  rescued_data_column: _rescued_data
  infer_column_types: true
  trigger_interval: 1 minute
  # Not optional on Free Edition - there is no event grid / SQS to notify from.
  use_notifications: false

  bronze_write_mode: append
  silver_read_mode: batch

  # Used by notebook 00 and by TransformContext.silver() when a gold transformation does
  # not name a schema explicitly.
  bronze_schema: bronze_crm
  silver_schema: silver_crm
  gold_schema: gold_sales

log_level: INFO
framework_version: 1.0.0-free
