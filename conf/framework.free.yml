# =====================================================================================
# Framework configuration - DATABRICKS FREE EDITION
# =====================================================================================
#
#   >>> TO RENAME THE CATALOG, CHANGE ONE LINE: `catalog:` IN THE vars BLOCK BELOW. <<<
#
# Everything downstream follows - the control/audit tables, the Volumes, the checkpoint
# root, the landing paths in conf/metadata/**.yml, and the DQ reference table. Nothing
# else needs editing, and notebooks/00_setup_framework.py creates whatever this names.
#
# Free Edition specifics, and why:
#
#   * checkpoint_root is a UC Volume path. Free Edition has no storage credential, so
#     abfss:// is unavailable - and a path containing "://" is rejected at config load.
#
#   * use_notifications is false and cannot be changed. File notification mode needs
#     cloud queue resources Free Edition does not provide, so Auto Loader uses directory
#     listing - fine at any volume you can generate here.
#
#   * No schedule and low concurrency, to stay inside the serverless budget.
# =====================================================================================

environment: free

# =====================================================================================
# vars - the only place physical names are written
# -------------------------------------------------------------------------------------
# Every name here is usable as ${name} throughout the rest of this file AND inside
# conf/metadata/**.yml. A var may reference another var. ${env} is always available.
#
# Unknown or misspelled placeholders fail at config load with the valid names listed,
# rather than producing a catalog literally called "${catalog}".
# =====================================================================================
vars:
  # ---- CHANGE THIS to rename everything -------------------------------------------
  # e.g. etl_framework, etl_lakehouse, my_sandbox, or `workspace` to reuse the catalog
  # Free Edition usually ships with.
  catalog: etl_framework

  # ---- framework's own schemas ----------------------------------------------------
  control_schema: etl_control
  audit_schema: etl_audit

  # ---- Volumes --------------------------------------------------------------------
  volumes_schema: etl_volumes
  landing_volume: landing
  checkpoint_volume: checkpoints

  # ---- layer schemas --------------------------------------------------------------
  # Under a single catalog these MUST differ from each other. If bronze and silver both
  # used "crm", then crm.customer would be the same table in both layers and the silver
  # load would overwrite its own source. Notebook 00 fails the setup if it detects that.
  bronze_schema: bronze_crm
  silver_schema: silver_crm
  gold_schema: gold_sales

# =====================================================================================
# Derived - you should not need to edit anything below
# =====================================================================================

framework_catalog: ${catalog}
control_schema: ${control_schema}
audit_schema: ${audit_schema}

# ---- logical -> physical catalog mapping --------------------------------------------
# LAYOUT A (this one): all three layers in one catalog, separated by schema. The safest
# choice on Free Edition, because it needs at most one catalog created.
#
# LAYOUT B: a catalog per layer, closer to production. Add three more vars
# (bronze_catalog / silver_catalog / gold_catalog) and reference them here instead.
# Notebook 00 creates all of them; nothing else changes, because control rows carry the
# logical tokens `bronze` / `silver` / `gold` rather than catalog names.
catalogs:
  bronze: ${catalog}
  silver: ${catalog}
  gold: ${catalog}

# ---- storage ------------------------------------------------------------------------
# Auto Loader's schema store and streaming checkpoints. Treat as data, not cache:
# deleting a feed's directory here makes that feed re-ingest its whole history.
checkpoint_root: /Volumes/${catalog}/${volumes_schema}/${checkpoint_volume}

# ---- what notebook 00 provisions ---------------------------------------------------
# Read only by notebooks/00_setup_framework.py. The runtime path ignores it.
free_edition:
  # Attempt CREATE CATALOG for anything named above that does not exist yet. If your
  # workspace refuses it, notebook 00 says so and tells you how to fall back to a
  # catalog you already have.
  create_catalogs: true

  volumes_catalog: ${catalog}
  volumes_schema: ${volumes_schema}
  landing_volume: ${landing_volume}
  checkpoint_volume: ${checkpoint_volume}

  # Schemas to create per layer, each in THAT layer's catalog - so this is correct under
  # both layouts above. Keys are the logical layer tokens.
  layer_schemas:
    bronze:
      - ${bronze_schema}
    silver:
      - ${silver_schema}
    gold:
      - ${gold_schema}

# ---- defaults applied when a control column is NULL --------------------------------
defaults:
  schema_evolution_mode: addNewColumns
  rescued_data_column: _rescued_data
  infer_column_types: true
  trigger_interval: 1 minute
  # Not optional on Free Edition - there is no event grid / SQS to notify from.
  use_notifications: false

  bronze_write_mode: append
  silver_read_mode: batch

  # Used by notebook 00, by the metadata token scope, and by TransformContext.silver()
  # when a gold transformation does not name a schema explicitly.
  bronze_schema: ${bronze_schema}
  silver_schema: ${silver_schema}
  gold_schema: ${gold_schema}

log_level: INFO
framework_version: 1.0.0-free
