# =====================================================================================
# DQ rule assignments - CRM  [FREE EDITION]
# -------------------------------------------------------------------------------------
# catalog_name / schema_name / table_name name the SOURCE table the silver task reads -
# the bronze table - because that is where the check runs. ${bronze_schema} resolves from
# conf/framework.<env>.yml.
#
# The sample data in notebooks/02_generate_sample_data.py is built to trip the `drop` and
# `warning` rules below, so a first run visibly quarantines rows without failing. The two
# `fail` rules on customer_id are satisfied by the sample data on purpose - see the README
# for how to trip one deliberately.
# =====================================================================================

defaults:
  catalog_name: bronze
  schema_name: ${bronze_schema}
  is_enabled: true

dq_rules_assignment:

  # ================================ customer =======================================
  # A null or duplicate business key would corrupt the SCD2 merge, so the whole batch
  # is refused rather than partially loaded.
  - table_name: customer
    column_name: customer_id
    rule_id: DQ_NOT_NULL
    severity: fail

  - table_name: customer
    column_name: customer_id
    rule_id: DQ_UNIQUE
    severity: fail

  # Sample row 1004 has an empty name -> quarantined and excluded.
  - table_name: customer
    column_name: customer_name
    rule_id: DQ_NOT_BLANK
    severity: drop

  # Sample row 1005 has "not-an-email" -> quarantined AND still loaded.
  - table_name: customer
    column_name: email
    rule_id: DQ_EMAIL_FORMAT
    severity: warning

  # Sample row 1006 has a three-letter country code -> quarantined and excluded.
  - table_name: customer
    column_name: country_code
    rule_id: DQ_LENGTH_EQUALS
    severity: drop
    rule_parameters:
      length: 2

  # Sample row 1007 has segment "PLATINUM", which is not in the list -> warning.
  - table_name: customer
    column_name: customer_segment
    rule_id: DQ_IN_LIST
    severity: warning
    rule_parameters:
      allowed_values: "'ENTERPRISE','MID_MARKET','SMB','PUBLIC_SECTOR'"

  # Sample row 1008 has a negative credit limit -> quarantined and excluded.
  - table_name: customer
    column_name: credit_limit
    rule_id: DQ_NON_NEGATIVE
    severity: drop

  - table_name: customer
    column_name: created_at
    rule_id: DQ_NOT_FUTURE_DATED
    severity: warning

  # ================================ sales_order ====================================
  - table_name: sales_order
    column_name: order_id
    rule_id: DQ_NOT_NULL
    severity: fail

  - table_name: sales_order
    column_name: customer_id
    rule_id: DQ_NOT_NULL
    severity: drop

  # Referential check against the BRONZE customer table, not silver. Every bronze task
  # completes before any silver task starts, so bronze is guaranteed to be there;
  # pointing this at silver_crm.customer would race on a first run, because the silver
  # tables load concurrently.
  #
  # reference_table needs a real three-part name, so it is built from tokens rather than
  # hard-coded - rename the catalog in conf/framework.<env>.yml and this follows.
  - table_name: sales_order
    column_name: customer_id
    rule_id: DQ_REFERENCE_EXISTS
    severity: warning
    rule_parameters:
      reference_table: ${bronze_catalog}.${bronze_schema}.customer
      reference_column: customer_id

  # Sample order 2004 has a negative amount -> quarantined and excluded.
  - table_name: sales_order
    column_name: order_amount
    rule_id: DQ_POSITIVE
    severity: drop

  # Sample order 2005 is in "JPY", which is not in the list -> quarantined.
  - table_name: sales_order
    column_name: currency_code
    rule_id: DQ_IN_LIST
    severity: drop
    rule_parameters:
      allowed_values: "'GBP','USD','EUR','INR','AUD'"

  - table_name: sales_order
    column_name: order_status
    rule_id: DQ_IN_LIST
    severity: drop
    rule_parameters:
      allowed_values: "'NEW','CONFIRMED','SHIPPED','DELIVERED','CANCELLED'"

  # Sample order 2006 is dated tomorrow -> quarantined and excluded.
  - table_name: sales_order
    column_name: order_date
    rule_id: DQ_NOT_FUTURE_DATED
    severity: drop
    rule_parameters:
      tolerance_days: 0

  # Sample order 2007 is DELIVERED with no delivery_date -> warning, still loaded.
  - table_name: sales_order
    column_name: delivery_date
    rule_id: DQ_NOT_NULL
    severity: warning
    filter_condition: "order_status = 'DELIVERED'"

  # Sample order 2008 is delivered before it was ordered -> quarantined.
  - table_name: sales_order
    column_name: order_date
    rule_id: DQ_COMPARE_COLUMNS
    severity: drop
    rule_parameters:
      other: delivery_date
      operator: "<="

  # ================================ interaction_event ==============================
  - table_name: interaction_event
    column_name: event_id
    rule_id: DQ_NOT_BLANK
    severity: drop

  - table_name: interaction_event
    column_name: event_ts
    rule_id: DQ_NOT_NULL
    severity: drop

  - table_name: interaction_event
    column_name: event_type
    rule_id: DQ_IN_LIST
    severity: warning
    rule_parameters:
      allowed_values: "'CALL','EMAIL','CHAT','MEETING','WEB_VISIT'"
